<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fbfd"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#e8f6ff"/><stop offset="1" stop-color="#f5fbff"/></linearGradient>
 <linearGradient id="orange" x2="0" y2="1"><stop stop-color="#fff1dd"/><stop offset="1" stop-color="#fffaf2"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#f1eaff"/><stop offset="1" stop-color="#fbf9ff"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#e4faf2"/><stop offset="1" stop-color="#f6fffb"/></linearGradient>
