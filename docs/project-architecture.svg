<rect x="26" y="1084" width="1548" height="88" rx="12" fill="url(#blue)" stroke="#76c6ff" stroke-width="1.4"/>
<text x="800" y="1117" class="head" text-anchor="middle">專案架構特色</text>
<g class="small" text-anchor="middle"><text x="180" y="1150">公開線上預約</text><text x="430" y="1150">JWT 權限驗證</text><text x="680" y="1150">MySQL 持久化</text><text x="930" y="1150">Redis 登入狀態</text><text x="1180" y="1150">Docker Compose</text><text x="1420" y="1150">健康檢查</text></g>
