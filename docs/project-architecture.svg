<rect x="48" y="532" width="320" height="218" rx="9" fill="#fff" stroke="#d5c5fb"/>
<ellipse cx="88" cy="575" rx="22" ry="9" fill="none" stroke="#6335ad" stroke-width="4"/><path d="M66 575v38c0 12 44 12 44 0v-38M66 594c0 12 44 12 44 0" fill="none" stroke="#6335ad" stroke-width="4"/>
<text x="130" y="573" class="label">MySQL 8.4</text><text x="130" y="596" class="small">主要業務資料</text>
<text x="68" y="645" class="small">• 會員與員工資料</text><text x="68" y="670" class="small">• 預約 / 店休設定</text><text x="68" y="695" class="small">• 操作稽核紀錄</text>
<line x1="65" y1="711" x2="350" y2="711" stroke="#e4daf8"/>
<text x="68" y="738" class="small">Redis 7：登入 Refresh Token（30 天）</text>
<path d="M390 625H684" fill="none" stroke="#14649a" stroke-width="2" marker-start="url(#arr2)" marker-end="url(#arr)"/>
<path d="M995 434V469" fill="none" stroke="#14649a" stroke-width="2" marker-end="url(#arr)"/><text x="1014" y="458" class="tiny">資料讀寫</text>

<!-- API capabilities -->
<g filter="url(#shadow)"><rect x="430" y="500" width="860" height="276" rx="12" fill="url(#orange)" stroke="#ff8a26" stroke-width="1.6"/></g>
<path d="M430 538v-26q0-12 12-12h836q12 0 12 12v26z" fill="#fff0db" stroke="#ff8a26" stroke-width="1.4"/>
