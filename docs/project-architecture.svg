<g>
<rect x="450" y="558" width="194" height="186" rx="9" fill="#fff" stroke="#ffbf7d"/><rect x="656" y="558" width="194" height="186" rx="9" fill="#fff" stroke="#ffbf7d"/><rect x="862" y="558" width="194" height="186" rx="9" fill="#fff" stroke="#ffbf7d"/><rect x="1068" y="558" width="202" height="186" rx="9" fill="#fff" stroke="#ffbf7d"/>
<text x="547" y="590" class="label" text-anchor="middle">預約管理</text><text x="547" y="621" class="small" text-anchor="middle">線上 / 店家建立</text><text x="547" y="645" class="small" text-anchor="middle">修改・取消・狀態</text><text x="547" y="669" class="small" text-anchor="middle">預約時段檢查</text><text x="547" y="710" class="tiny muted" text-anchor="middle">公開預約連結</text>
<text x="753" y="590" class="label" text-anchor="middle">會員管理</text><text x="753" y="621" class="small" text-anchor="middle">依電話查詢</text><text x="753" y="645" class="small" text-anchor="middle">會員資料維護</text><text x="753" y="669" class="small" text-anchor="middle">未到紀錄</text>
<text x="959" y="590" class="label" text-anchor="middle">帳號與權限</text><text x="959" y="621" class="small" text-anchor="middle">員工登入</text><text x="959" y="645" class="small" text-anchor="middle">JWT 驗證</text><text x="959" y="669" class="small" text-anchor="middle">依角色限制操作</text>
<text x="1169" y="590" class="label" text-anchor="middle">店務與報表</text><text x="1169" y="621" class="small" text-anchor="middle">公休日期設定</text><text x="1169" y="645" class="small" text-anchor="middle">今日預約統計</text><text x="1169" y="669" class="small" text-anchor="middle">操作稽核紀錄</text>
</g>

<!-- Deployment -->
<g filter="url(#shadow)"><rect x="26" y="816" width="1548" height="248" rx="12" fill="#fff" stroke="#ec74b9" stroke-width="1.5" stroke-dasharray="7 4"/></g>
<path d="M26 854v-26q0-12 12-12h1524q12 0 12 12v26z" fill="#fff0f8" stroke="#ec74b9" stroke-width="1.2" stroke-dasharray="7 4"/>
<text x="52" y="847" class="head" fill="#9c3175">部署環境與工具</text><text x="1546" y="846" class="small muted" text-anchor="end">本機 Docker Compose 部署</text>
<rect x="48" y="877" width="474" height="158" rx="10" fill="#fff" stroke="#efadd3"/><rect x="550" y="877" width="474" height="158" rx="10" fill="#fff" stroke="#efadd3"/><rect x="1052" y="877" width="496" height="158" rx="10" fill="#fff" stroke="#efadd3"/>
<text x="72" y="911" class="label">Spring Boot 容器</text><text x="72" y="941" class="small">• Java 17 / Eclipse Temurin</text><text x="72" y="967" class="small">• 靜態網站 + REST API</text><text x="72" y="993" class="small">• 對外服務埠 8081 → 容器 8080</text>
<text x="574" y="911" class="label">MySQL 8.4</text><text x="574" y="941" class="small">• 資料持久化 Volume</text><text x="574" y="967" class="small">• 啟動前健康檢查</text><text x="574" y="993" class="small">• Spring Data JPA</text>
<text x="1076" y="911" class="label">Redis 7</text><text x="1076" y="941" class="small">• 資料持久化 Volume</text><text x="1076" y="967" class="small">• 啟動前健康檢查</text><text x="1076" y="993" class="small">• 開發設定可使用 H2 測試資料庫</text>

