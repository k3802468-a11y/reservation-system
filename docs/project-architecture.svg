<text x="121" y="378" class="body" text-anchor="middle">電腦 / 手機瀏覽器</text>

<!-- Frontend -->
<g filter="url(#shadow)"><rect x="260" y="126" width="390" height="308" rx="12" fill="url(#blue)" stroke="#2196f3" stroke-width="1.6"/></g>
<path d="M260 164v-26q0-12 12-12h366q12 0 12 12v26z" fill="#e2f3ff" stroke="#2196f3" stroke-width="1.4"/>
<text x="455" y="157" class="headFront" text-anchor="middle">前端（HTML / CSS / JavaScript）</text>
<line x1="455" y1="178" x2="455" y2="282" stroke="#6abef2" stroke-dasharray="5 4"/>
<text x="358" y="203" class="label" text-anchor="middle">客戶預約網站</text>
<text x="552" y="203" class="label" text-anchor="middle">店家管理後台</text>
<text x="358" y="236" class="body" text-anchor="middle">線上建立預約</text><text x="358" y="260" class="body" text-anchor="middle">查看 / 修改 / 取消</text>
<text x="552" y="236" class="body" text-anchor="middle">員工登入</text><text x="552" y="260" class="body" text-anchor="middle">預約 / 公休管理</text>
<rect x="278" y="286" width="354" height="126" rx="9" fill="#fff" fill-opacity=".82" stroke="#65baf0" stroke-dasharray="5 3"/>
