 <marker id="arr2" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9 0L0 4.5L9 9z" fill="#14649a"/></marker>
 <style>
    text{font-family:"DFKai-SB","標楷體",sans-serif;fill:#173f63}
 .title{font-size:52px;font-weight:700;fill:#123b63}.subtitle{font-size:25px;fill:#205887}
 .head{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:19px}.small{font-size:15px}.tiny{font-size:13px}
 .headFront{font-size:19px;font-weight:700}.headBackend{font-size:22px;font-weight:700}
 .muted{fill:#52728e}.white{fill:#fff}
 </style>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<text x="800" y="56" class="title" text-anchor="middle">專案完整架構圖</text>
<text x="800" y="88" class="subtitle" text-anchor="middle">（智慧店家預約管理系統）</text>

<!-- User -->
<g filter="url(#shadow)"><rect x="26" y="126" width="190" height="308" rx="12" fill="url(#blue)" stroke="#2196f3" stroke-width="1.6"/></g>
<path d="M26 164v-26q0-12 12-12h166q12 0 12 12v26z" fill="#e2f3ff" stroke="#2196f3" stroke-width="1.4"/>
<text x="121" y="157" class="head" text-anchor="middle">使用者</text>
<circle cx="121" cy="213" r="28" fill="#c7e8fc"/><circle cx="121" cy="205" r="9" fill="#1674b7"/><path d="M102 231q2-19 19-19t19 19" fill="#1674b7"/>
<text x="121" y="260" class="label" text-anchor="middle">顧客 / 店家人員</text>
