<text x="298" y="340" class="body">• 線上預約與專屬連結</text><text x="298" y="365" class="body">• 店家預約管理 / 狀態更新</text><text x="298" y="390" class="body">• 今日統計 / 營業日與公休設定</text>
<path d="M216 273H250" fill="none" stroke="#14649a" stroke-width="2" marker-end="url(#arr)"/><text x="232" y="257" class="tiny" text-anchor="middle">瀏覽</text>

<!-- Backend API -->
<g filter="url(#shadow)"><rect x="700" y="126" width="590" height="308" rx="12" fill="url(#orange)" stroke="#ff8a26" stroke-width="1.6"/></g>
<path d="M700 164v-26q0-12 12-12h566q12 0 12 12v26z" fill="#fff0db" stroke="#ff8a26" stroke-width="1.4"/>
<text x="995" y="157" class="headBackend" text-anchor="middle">後端服務（Spring Boot / Java 17）</text>
<text x="995" y="188" class="small muted" text-anchor="middle">REST API · Spring Security · Spring Data JPA</text>
<rect x="718" y="204" width="172" height="125" rx="9" fill="#fff" stroke="#ffb464"/><rect x="900" y="204" width="172" height="125" rx="9" fill="#fff" stroke="#ffb464"/><rect x="1082" y="204" width="190" height="125" rx="9" fill="#fff" stroke="#ffb464"/>
<text x="804" y="233" class="label" text-anchor="middle">預約服務</text><text x="804" y="260" class="small" text-anchor="middle">建立 / 查詢</text><text x="804" y="282" class="small" text-anchor="middle">修改 / 取消 / 狀態</text><text x="804" y="307" class="tiny muted" text-anchor="middle">時段與人數檢查</text>
<text x="986" y="233" class="label" text-anchor="middle">會員與員工</text><text x="986" y="260" class="small" text-anchor="middle">會員資料查詢</text><text x="986" y="282" class="small" text-anchor="middle">員工帳號管理</text><text x="986" y="307" class="tiny muted" text-anchor="middle">JWT 登入 / 角色權限</text>
<text x="1177" y="233" class="label" text-anchor="middle">店務管理</text><text x="1177" y="260" class="small" text-anchor="middle">營業日 / 公休日</text><text x="1177" y="282" class="small" text-anchor="middle">今日統計 / 稽核紀錄</text><text x="1177" y="307" class="tiny muted" text-anchor="middle">資料與操作追蹤</text>
<rect x="718" y="344" width="554" height="67" rx="9" fill="#fff" stroke="#ffb464"/>
<text x="995" y="373" class="label" text-anchor="middle">Spring Boot 應用程式</text><text x="995" y="396" class="small muted" text-anchor="middle">提供網站靜態頁面與 API　·　輸入驗證　·　健康狀態端點</text>
<path d="M650 273H687" fill="none" stroke="#14649a" stroke-width="2" marker-start="url(#arr2)" marker-end="url(#arr)"/><text x="669" y="257" class="tiny" text-anchor="middle">API</text>

<!-- Database -->
<g filter="url(#shadow)"><rect x="26" y="474" width="364" height="302" rx="12" fill="url(#violet)" stroke="#8c4bfa" stroke-width="1.6"/></g>
<path d="M26 512v-26q0-12 12-12h340q12 0 12 12v26z" fill="#eee6ff" stroke="#8c4bfa" stroke-width="1.4"/>
