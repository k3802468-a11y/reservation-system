<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="煙深雨靜的線上訂位系統，輕鬆預約您的美好時光。">
  <title>煙深雨靜｜線上預約</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="shell">

    <!-- Hero -->
    <section class="hero">
      <p class="eyebrow">SHIGUANG RESTAURANT</p>
      <h1>留住相聚的時光<br>從一席美好開始</h1>
      <p class="subtitle">請填寫下方資料，我們將為您保留最適合的座位。</p>
      <p class="subtitle">店內專線：04-2312-7352。</p>
      <div class="highlights">
        <span id="business-days-text">營業時間</span>
        <span>15:00 – 02:00</span>
      </div>
    </section>

    <!-- Booking Card -->
    <section class="card" aria-labelledby="booking-title">

      <!-- Step Indicator -->
      <div class="step" role="list">
        <span class="step-num active" role="listitem">01</span>
        <span class="step-label">填寫資料</span>
        <span class="step-line" aria-hidden="true"></span>
        <span class="step-num" role="listitem">02</span>
        <span class="step-label">完成預約</span>
      </div>

      <h2 id="booking-title">煙深雨靜 | 線上訂位</h2>
      <p class="hint">欄位標示 <b>*</b> 為必填資料</p>

      <form id="booking-form" novalidate>
        <div class="grid">
          <label>
            預約日期 <b>*</b>
            <input id="date" name="reservationDate" type="date" required>
            <span id="date-closed-hint" class="date-closed-hint" hidden></span>
          </label>
          <label>
            預約時間 <b>*</b>
            <select id="time" name="reservationTime" required>
              <option value="" disabled selected>請選擇預計時間</option>
              <option value="15:00">15:00</option>
              <option value="15:30">15:30</option>
              <option value="16:00">16:00</option>
              <option value="16:30">16:30</option>
              <option value="17:00">17:00</option>
              <option value="17:30">17:30</option>
              <option value="18:00">18:00</option>
              <option value="18:30">18:30</option>
              <option value="19:00">19:00</option>
              <option value="19:30">19:30</option>
              <option value="20:00">20:00</option>
              <option value="20:30">20:30</option>
              <option value="21:00">21:00</option>
              <option value="21:30">21:30</option>
              <option value="22:00">22:00</option>
              <option value="22:30">22:30</option>
              <option value="23:00">23:00</option>
              <option value="23:30">23:30</option>
              <option value="00:00">00:00</option>
            </select>
          </label>
          <label>
            訂位人數 <b>*</b>
            <input name="guestCount" type="number" min="1" max="99" step="1" inputmode="numeric" required
              placeholder="請輸入人數">
          </label>
          <label class="recommended">
            推薦店員 <span>（選填）</span>
            <input name="recommendedBy" maxlength="100" placeholder="請輸入店員姓名">
          </label>
          <label>
            姓名 <b>*</b>
            <input name="name" maxlength="100" autocomplete="name" required placeholder="請輸入姓名">
          </label>
          <label>
            電話 <b>*</b>
            <input name="phone" inputmode="tel" autocomplete="tel" pattern="[0-9+() -]{6,20}" required
              placeholder="09xxxxxxxx">
          </label>
        </div>

        <div class="form-divider"></div>

        <label>
          備註 <span>（選填）</span>
          <textarea name="notes" maxlength="500" placeholder="例如：兒童座椅、過敏需求或其他安排"></textarea>
        </label>

        <button id="submit" type="submit">送出預約 <span>→</span></button>
        <button id="cancel" class="secondary" type="button" hidden>取消此預約</button>

        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <p class="privacy">
        送出後將立即同步至店家系統；請妥善保留此頁連結，以便日後查看、修改或取消預約，或致電聯絡。
      </p>
    </section>

  </main>

  <!-- Footer: Google Maps Link -->
  <footer class="site-footer">
    <a id="map-link"
      href="https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E4%B8%AD%E5%B8%82%E8%A5%BF%E5%B1%AF%E5%8D%80%E5%AF%A7%E5%A4%8F%E8%B7%AF87%E8%99%9F1%E6%A8%93"
      target="_blank" rel="noopener noreferrer" aria-label="在 Google Maps 查看店家位置">
      <svg class="map-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Z" />
        <circle cx="12" cy="9" r="2.5" />
      </svg>
      <span class="map-text">煙深雨靜</span>
    </a>
  </footer>

  <script src="app.js"></script>
</body>

</html>
